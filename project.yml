# Generated by scripts/generate.py. Edit the PRODUCTS table there, not this file.
name: Infinitum
options:
  bundleIdPrefix: app.infinitum
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Public Amplitude API key, passed at build time (CI: repo variable AMPLITUDE_API_KEY).
    # Empty means no analytics. Never the secret key.
    AMPLITUDE_API_KEY: ""
    DEAD_CODE_STRIPPING: YES
packages:
  InfinitumKit:
    path: Packages/InfinitumKit
targets:
  Scalvs:
    type: application
    supportedDestinations: [iOS, macOS]
    scheme: {}
    sources:
      - path: Shell
      - path: Apps/Scalvs
    dependencies:
      - package: InfinitumKit
    info:
      path: Generated/Scalvs-Info.plist
      properties:
        CFBundleDisplayName: "SCALVS.ai"
        AmplitudeAPIKey: $(AMPLITUDE_API_KEY)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Scalvs
        PRODUCT_BUNDLE_IDENTIFIER: app.infinitum.scalvs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
